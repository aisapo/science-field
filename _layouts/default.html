<!doctype html><html lang="{{ site.lang | default: 'ja' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title><meta name="description" content="{{ page.excerpt | default: site.description | strip_html | escape }}"><link rel="stylesheet" href="{{ '/style.css' | relative_url }}"></head><body><div class="site-loader" id="site-loader" aria-hidden="true">
  <div class="site-loader-inner">
    <div class="loader-logo-wrap">
      <span class="loader-bubble b1"></span><span class="loader-bubble b2"></span><span class="loader-bubble b3"></span>
      <img class="site-loader-logo" src="{{ '/assets/learboratory-microbe-mark.svg' | relative_url }}" alt="" width="180" height="180">
    </div>
    <div class="site-loader-name">LEARBORATORY</div>
    <div class="site-loader-track" aria-hidden="true"><span class="site-loader-bar"></span></div>
  </div>
</div><header class="site-header"><a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark"><img src="{{ '/assets/learboratory-microbe-mark.svg' | relative_url }}" alt=""></span><span>LEARBORATORY</span></a><nav><a href="{{ '/' | relative_url }}#articles">Articles</a><a href="{{ '/' | relative_url }}#favorites">Favorites</a><a href="{{ '/' | relative_url }}#about">About</a><a class="admin-link" href="https://app.pagescms.org/" target="_blank" rel="noopener">管理</a></nav></header><main>{{ content }}</main><footer class="site-footer"><div>LEARBORATORY</div><div>SCIENCE FIELD</div></footer><script>
(function(){
  const loader=document.getElementById('site-loader');
  if(!loader)return;
  const started=performance.now();
  function hideLoader(){
    const wait=Math.max(0,650-(performance.now()-started));
    setTimeout(function(){
      loader.classList.add('is-hidden');
      setTimeout(function(){loader.remove();},520);
    },wait);
  }
  if(document.readyState==='complete') hideLoader();
  else window.addEventListener('load',hideLoader,{once:true});
})();
</script></body></html>
