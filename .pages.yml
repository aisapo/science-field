media:
  - name: images
    label: Images
    input: images
    output: /science-field/images
    extensions: [jpg, jpeg, png, webp, gif]
    categories: [image]
    rename: safe

content:
  - name: posts
    label: Articles
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    view:
      primary: title
      fields: [title, category, date]
      sort: date
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - Biology
            - Chemistry
            - Microbiology
            - Agriculture
            - Environment
            - Science
            - Research
      - name: date
        label: Publication date
        type: date
        required: true
      - name: thumbnail
        label: Thumbnail
        type: image
        options:
          media: images
          path: articles
          extensions: [jpg, jpeg, png, webp]
      - name: excerpt
        label: Excerpt
        type: text
      - name: body
        label: Article body
        type: rich-text
        options:
          format: markdown
          media: images
          path: articles
          switcher: true

settings:
  commit:
    identity: app
    templates:
      create: "article(create): {path}"
      update: "article(update): {path}"
      delete: "article(delete): {path}"
      rename: "article(rename): {oldPath} -> {newPath}"
