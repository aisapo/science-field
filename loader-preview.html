<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEARBORATORY Loader Preview</title>
<style>
:root{--paper:#f7f8f5;--ink:#1c2522;--line:#dce3df;--accent:#315f50}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);font-family:Inter,"Noto Sans JP",sans-serif;color:var(--ink)}
body{min-height:100vh;display:grid;place-items:center}
.site-loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper)}
.site-loader-inner{width:min(230px,62vw);display:flex;flex-direction:column;align-items:center}
.site-loader-logo{width:min(150px,48vw);height:auto;display:block}
.site-loader-name{margin-top:18px;font-size:12px;font-weight:500;letter-spacing:.34em;line-height:1;text-indent:.34em}
.site-loader-track{width:min(190px,52vw);height:2px;margin-top:22px;overflow:hidden;background:var(--line)}
.site-loader-bar{display:block;width:42%;height:100%;background:var(--accent);transform:translateX(-110%);animation:progress 1.05s cubic-bezier(.4,0,.2,1) infinite}
@keyframes progress{0%{transform:translateX(-110%)}55%{transform:translateX(125%)}100%{transform:translateX(250%)}}
</style>
</head>
<body>
<div class="site-loader">
  <div class="site-loader-inner">
    <img class="site-loader-logo" src="assets/learboratory-microbe-mark.png" alt="">
    <div class="site-loader-name">LEARBORATORY</div>
    <div class="site-loader-track"><span class="site-loader-bar"></span></div>
  </div>
</div>
</body>
</html>
